<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Wacom Cintiq Reconnect Fix</title>
  <desc id="desc">A pen display reconnecting cleanly to a Mac</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <circle cx="1060" cy="50" r="180" fill="#6366f1" opacity=".13"/>
  <circle cx="760" cy="430" r="230" fill="#0ea5e9" opacity=".09"/>
  <g transform="translate(82 82)" filter="url(#shadow)">
    <rect x="0" y="0" width="350" height="224" rx="23" fill="#0b1020" stroke="#94a3b8" stroke-width="5"/>
    <rect x="19" y="18" width="312" height="188" rx="12" fill="url(#screen)"/>
    <path d="M89 244h172l24 30H65z" fill="#64748b"/>
    <path d="M245 67l81 88" stroke="#f8fafc" stroke-width="13" stroke-linecap="round"/>
    <path d="M242 63l-9 23 22-10z" fill="#f8fafc"/>
    <path d="M352 109c39 0 39 73 79 73" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 14"/>
    <circle cx="431" cy="182" r="12" fill="#34d399"/>
  </g>
  <text x="540" y="142" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="750">Cintiq reconnect,</text>
  <text x="540" y="205" fill="#c4b5fd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="750">without the ritual.</text>
  <text x="544" y="265" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24">Native IOKit events · zero polling · no root</text>
  <g transform="translate(544 299)">
    <rect width="206" height="44" rx="22" fill="#22c55e" opacity=".16"/>
    <circle cx="25" cy="22" r="8" fill="#4ade80"/>
    <text x="45" y="29" fill="#bbf7d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="650">Ready when you are</text>
  </g>
</svg>
