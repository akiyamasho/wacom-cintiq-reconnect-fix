<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">How the reconnect fix works</title>
  <desc id="desc">USB arrival triggers a delayed driver claim check and only an unhealthy state restarts Wacom services</desc>
  <rect width="1100" height="250" rx="24" fill="#f8fafc"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <g transform="translate(30 55)">
      <rect width="220" height="140" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <text x="110" y="61" font-size="35">🔌</text>
      <text x="110" y="96" fill="#0f172a" font-size="20" font-weight="700">USB attach event</text>
      <text x="110" y="121" fill="#475569" font-size="15">IOKit wakes the agent</text>
    </g>
    <path d="M260 125h65" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(335 55)">
      <rect width="220" height="140" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
      <text x="110" y="61" font-size="35">⏱</text>
      <text x="110" y="96" fill="#0f172a" font-size="20" font-weight="700">3-second grace</text>
      <text x="110" y="121" fill="#475569" font-size="15">Let normal startup finish</text>
    </g>
    <path d="M565 125h65" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(640 55)">
      <rect width="220" height="140" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="110" y="61" font-size="35">✓</text>
      <text x="110" y="96" fill="#0f172a" font-size="20" font-weight="700">Driver claim check</text>
      <text x="110" y="121" fill="#475569" font-size="15">Healthy means do nothing</text>
    </g>
    <path d="M870 125h65" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(945 55)">
      <rect width="125" height="140" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/>
      <text x="62" y="61" font-size="35">↻</text>
      <text x="62" y="93" fill="#0f172a" font-size="17" font-weight="700">Recover</text>
      <text x="62" y="117" fill="#475569" font-size="13">Only if</text>
      <text x="62" y="135" fill="#475569" font-size="13">unclaimed</text>
    </g>
  </g>
</svg>
